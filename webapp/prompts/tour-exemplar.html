<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Berry Leo-Center Leonberg · Virtual tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1511; --panel:rgba(246,240,231,.9); --panel-solid:#f6f0e7; --ink:#2f2119; --muted:#6e5a4a;
  --accent:#9a6a3a; --line:rgba(47,33,25,.16); --chip:#fffaf3; --chip-on:#3a271b; --chip-on-ink:#f4eadb;
  --shadow:0 6px 24px rgba(28,18,12,.22);
  --map-floor:#efe6d6; --map-mall:#d9d5ce; --map-street:#c9c6c0; --map-terrace:#b9aa98; --map-solid:#8d7f71; --map-furn:#5b3d2a; --map-me:#b5762f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Jost",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#120d0a; --panel:rgba(30,22,17,.88); --panel-solid:#1e1611; --ink:#f2e8d9; --muted:#bfaa93; --accent:#d4a36b;
    --line:rgba(242,232,217,.16); --chip:#2a1f18; --chip-on:#e6cba4; --chip-on-ink:#22170f; --shadow:0 6px 24px rgba(0,0,0,.45);
    --map-floor:#4a3d33; --map-mall:#352e29; --map-street:#2c2825; --map-terrace:#5b4c3f; --map-solid:#6f6256; --map-furn:#c9a77f; --map-me:#f0b46a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#120d0a; --panel:rgba(30,22,17,.88); --panel-solid:#1e1611; --ink:#f2e8d9; --muted:#bfaa93; --accent:#d4a36b;
  --line:rgba(242,232,217,.16); --chip:#2a1f18; --chip-on:#e6cba4; --chip-on-ink:#22170f; --shadow:0 6px 24px rgba(0,0,0,.45);
  --map-floor:#4a3d33; --map-mall:#352e29; --map-street:#2c2825; --map-terrace:#5b4c3f; --map-solid:#6f6256; --map-furn:#c9a77f; --map-me:#f0b46a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#scene.dragging{cursor:grabbing}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.ident{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;padding:10px 16px 11px;box-shadow:var(--shadow);pointer-events:auto;max-width:min(360px,62vw)}
.wordmark{font-weight:600;font-size:21px;letter-spacing:-.01em;line-height:1}
.site{font-size:13px;color:var(--muted);margin-top:4px}
.where{font-size:15px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.where b{font-weight:500}

.mapwrap{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;padding:8px;box-shadow:var(--shadow);pointer-events:auto}
.mapwrap[hidden]{display:none}
#map{display:block;width:132px;height:222px;cursor:crosshair}
.maphint{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}

.bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;box-shadow:var(--shadow);pointer-events:auto}
.story{max-width:420px;padding:14px 16px 15px;position:relative}
.story[hidden]{display:none}
.story .num{font-size:13px;color:var(--accent);font-weight:500}
.story h2{font-size:19px;font-weight:500;margin:2px 0 6px;letter-spacing:-.005em}
.story p{font-size:14.5px;line-height:1.5;margin:0;color:var(--ink)}
.story .close{position:absolute;top:8px;right:8px;border:0;background:transparent;font-size:13px;color:var(--muted);padding:6px 8px;border-radius:8px;cursor:pointer}
.story .close:hover{background:var(--line)}

.bar{display:flex;align-items:center;gap:8px;padding:8px}
.stops{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.stops::-webkit-scrollbar{display:none}
.stop{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px 6px 6px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.stop .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--line)}
.stop[aria-current="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.stop[aria-current="true"] .n{background:rgba(255,255,255,.18)}
.actions{display:flex;gap:6px;flex:0 0 auto}
.act{border:0;border-radius:999px;padding:8px 14px;font-size:13.5px;cursor:pointer;background:var(--chip);border:1px solid var(--line);white-space:nowrap}
.act.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:500}
.act:hover{filter:brightness(.97)}

.joy{position:absolute;left:24px;bottom:150px;width:116px;height:116px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);touch-action:none;display:none}
.joy .knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--accent);opacity:.9}
.coarse .joy{display:block}

.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}

.help{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,14,10,.35);padding:20px}
.help[hidden]{display:none}
.help .panel{max-width:400px;padding:22px 22px 18px}
.help h2{margin:0 0 4px;font-size:22px;font-weight:500}
.help p{margin:0 0 14px;color:var(--muted);font-size:14.5px;line-height:1.5}
.help ul{margin:0 0 18px;padding:0;list-style:none;font-size:14.5px;line-height:1.45}
.help li{padding:7px 0;border-top:1px solid var(--line)}
.help li b{font-weight:500}
.help .row{display:flex;gap:8px;justify-content:flex-end}

.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:#efe4d3;transition:opacity .6s}
.loading .w{font-size:30px;font-weight:600;letter-spacing:-.01em;text-align:center}
.loading .s{font-size:14px;color:#b9a58e;text-align:center;margin-top:8px}
.loading.done{opacity:0;pointer-events:none}

@media (max-width:640px){
  .wordmark{font-size:18px}
  .ident{padding:8px 12px 9px}
  .where{font-size:14px}
  #map{width:110px;height:185px}
  .bar{flex-direction:column;align-items:stretch}
  .actions{justify-content:space-between}
  .act{flex:1;padding:8px 8px}
  .story{max-width:none}
  .joy{bottom:200px}
}
@media (prefers-reduced-motion: reduce){ .toast,.loading{transition:none} }
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" tabindex="0" aria-label="3D view of the Coffee Berry café. Drag to look around; use W A S D or arrow keys to walk."></canvas>

  <div class="top">
    <div class="ident">
      <div class="wordmark">coffee berry</div>
      <div class="site">Leo-Center Leonberg, flagship concept</div>
      <div class="where" id="where">You’re on the <b>street</b></div>
    </div>
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" aria-label="Floor plan map. Click a spot to go there."></canvas>
      <div class="maphint">Click to go there</div>
    </div>
  </div>

  <div class="bottom">
    <section class="panel story" id="story" hidden aria-live="polite">
      <button class="close" id="storyClose" type="button">Close</button>
      <div class="num" id="storyNum"></div>
      <h2 id="storyTitle"></h2>
      <p id="storyText"></p>
    </section>
    <div class="panel bar">
      <nav class="stops" id="stops" aria-label="Tour stops"></nav>
      <div class="actions">
        <button class="act primary" id="play" type="button">Play tour</button>
        <button class="act" id="mode" type="button">Evening</button>
        <button class="act" id="mapBtn" type="button">Hide map</button>
        <button class="act" id="helpBtn" type="button">Controls</button>
      </div>
    </div>
  </div>

  <div class="joy" id="joy" aria-hidden="true"><div class="knob" id="knob"></div></div>
  <div class="toast" id="toast"></div>

  <div class="help" id="help">
    <div class="panel">
      <h2>Walk the café</h2>
      <p>A walkable model of plan A01 with the upgraded finishes from the visualization brief.</p>
      <ul id="helpList"></ul>
      <div class="row">
        <button class="act" id="helpClose" type="button">Explore freely</button>
        <button class="act primary" id="helpPlay" type="button">Play tour</button>
      </div>
    </div>
  </div>

  <div class="loading" id="loading"><div><div class="w">coffee berry</div><div class="s">Setting the tables…</div></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
'use strict';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
if (coarse) document.getElementById('app').classList.add('coarse');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R = mulberry32(20261104);

try{
  await Promise.race([
    Promise.all([document.fonts.load('600 64px Jost'),document.fonts.load('400 64px Jost'),document.fonts.load('64px Allura')]),
    new Promise(r=>setTimeout(r,3000))
  ]);
}catch(e){}

/* ---------- renderer ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, 1, 0.05, 160);
camera.rotation.order = 'YXZ';
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

/* ---------- textures ---------- */
function makeTex(w,h,draw,clamp){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=ANISO;
  if(!clamp){ t.wrapS=t.wrapT=THREE.RepeatWrapping; }
  return t;
}
function speckle(g,w,h,n,cols,smin,smax,alpha){
  for(let i=0;i<n;i++){ g.globalAlpha=alpha*(0.4+R()*0.6); g.fillStyle=cols[(R()*cols.length)|0];
    const s=smin+R()*(smax-smin); g.fillRect(R()*w,R()*h,s,s); }
  g.globalAlpha=1;
}
function mottle(g,w,h,n,cols,rmin,rmax,amin,amax){
  for(let i=0;i<n;i++){ const x=R()*w,y=R()*h,r=rmin+R()*(rmax-rmin);
    const gr=g.createRadialGradient(x,y,0,x,y,r); const c=cols[(R()*cols.length)|0];
    gr.addColorStop(0,c); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.globalAlpha=amin+R()*(amax-amin); g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r);
    for(const dx of [-w,w]){ if(x+dx-r<w && x+dx+r>0){ g.fillRect(x+dx-r,y-r,2*r,2*r);} }
  }
  g.globalAlpha=1;
}
const T = {};
T.terrazzo = makeTex(1024,1024,(g,w,h)=>{
  g.fillStyle='#cbc3b6'; g.fillRect(0,0,w,h);
  mottle(g,w,h,60,['#d6cfc4','#bfb6a8'],60,200,.25,.5);
  speckle(g,w,h,14000,['#b5ab9d','#e0d9ce','#9f9588','#7d7366'],1,3,.7);
  const cols=['#ece6dc','#9a8f82','#83786b','#d9c8ae','#b6a894','#6c635a','#f4f0e9','#c3b39b','#a39a8f'];
  for(let i=0;i<650;i++){
    const cx=R()*w,cy=R()*h,rad=5+Math.pow(R(),2.2)*34,n=5+(R()*4|0);
    g.fillStyle=cols[(R()*cols.length)|0];
    g.beginPath();
    for(let k=0;k<n;k++){const a=k/n*Math.PI*2+R()*.6,rr=rad*(.55+R()*.55),px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr; k?g.lineTo(px,py):g.moveTo(px,py);}
    g.closePath(); g.fill();
  }
});
function woodTex(base,cols,slat){
  return makeTex(512,512,(g,w,h)=>{
    g.fillStyle=base; g.fillRect(0,0,w,h);
    for(let i=0;i<320;i++){
      const x0=R()*w, amp=1.5+R()*7, fr=(2*Math.PI*(1+(R()*3|0)))/h, ph=R()*6;
      g.strokeStyle=cols[(R()*cols.length)|0]; g.globalAlpha=.12+R()*.35; g.lineWidth=.6+R()*2.4;
      g.beginPath(); for(let y=0;y<=h;y+=8){const x=x0+Math.sin(y*fr+ph)*amp; y?g.lineTo(x,y):g.moveTo(x,y);} g.stroke();
    }
    g.globalAlpha=1;
    if(slat){ const step=w/slat.n;
      for(let i=0;i<slat.n;i++){ g.fillStyle=slat.gap; g.fillRect(i*step,0,step*slat.g,h);
        g.fillStyle='rgba(255,255,255,.07)'; g.fillRect(i*step+step*slat.g,0,3,h);
        g.fillStyle='rgba(0,0,0,.12)'; g.fillRect((i+1)*step-4,0,4,h); } }
  });
}
T.walnut = woodTex('#5a3a27',['#3c2417','#7b5338','#6a4430','#2f1c12']);
T.walnutSlat = woodTex('#5a3a27',['#3c2417','#7b5338','#6a4430'],{n:8,g:.3,gap:'#151110'});
T.oak = woodTex('#c9a77c',['#ad8a5f','#dcc29c','#b9956a']);
T.oakSlat = woodTex('#c4a074',['#a7845a','#dcc29c'],{n:10,g:.2,gap:'#3a2a1d'});
T.teak = woodTex('#97683f',['#74502f','#b6875a','#664325']);
function plaster(base,cols){
  return makeTex(512,512,(g,w,h)=>{ g.fillStyle=base; g.fillRect(0,0,w,h);
    mottle(g,w,h,170,cols,20,110,.03,.07); speckle(g,w,h,5000,cols,1,2,.18); });
}
T.wall = plaster('#e8decd',['#f3ebde','#d7cab5','#e0d2bc']);
T.ceiling = plaster('#2d2b29',['#3a3836','#222020']);
T.micro = plaster('#a69f95',['#bab3a9','#8e877d']);
T.taupe = plaster('#b8ab98',['#c7bba9','#a69885']);
T.mallWall = plaster('#e9e7e3',['#f3f2ef','#dad7d1']);
T.floor = makeTex(1024,1024,(g,w,h)=>{
  g.fillStyle='#a7a198'; g.fillRect(0,0,w,h);
  mottle(g,w,h,120,['#b4aea5','#99938a','#aaa49b'],40,180,.05,.14);
  speckle(g,w,h,22000,['#8f8981','#bcb6ad'],1,2,.35);
  g.strokeStyle='rgba(78,72,66,.6)'; g.lineWidth=2.5;
  for(const p of [1,w/2]){ g.beginPath(); g.moveTo(p,0); g.lineTo(p,h); g.stroke(); g.beginPath(); g.moveTo(0,p); g.lineTo(w,p); g.stroke(); }
});
T.granite = makeTex(512,512,(g,w,h)=>{ g.fillStyle='#29292b'; g.fillRect(0,0,w,h);
  speckle(g,w,h,9000,['#4a4a4d','#1a1a1b','#5f5e5b','#3a3a3c'],1,3,.8); });
T.boucle = makeTex(256,256,(g,w,h)=>{ g.fillStyle='#ddd3c3'; g.fillRect(0,0,w,h);
  for(let i=0;i<2200;i++){ g.strokeStyle=R()<.5?'rgba(255,252,245,.55)':'rgba(150,136,116,.35)'; g.lineWidth=1+R()*1.2;
    g.beginPath(); g.arc(R()*w,R()*h,1.5+R()*3,R()*6,R()*6+3); g.stroke(); } });
T.rope = makeTex(256,256,(g,w,h)=>{ g.fillStyle='#8f7a58'; g.fillRect(0,0,w,h);
  const s=32; for(let y=0;y<h;y+=s){ for(let x=0;x<w;x+=s){ const hor=((x+y)/s)%2===0;
    g.fillStyle='#cdb892'; if(hor){ g.fillRect(x+2,y+5,s-4,s-10);} else { g.fillRect(x+5,y+2,s-10,s-4);} 
    g.fillStyle='rgba(255,255,255,.15)'; if(hor) g.fillRect(x+2,y+6,s-4,3); else g.fillRect(x+6,y+2,3,s-4); } } });
T.pavers = makeTex(512,512,(g,w,h)=>{ g.fillStyle='#b8b4ad'; g.fillRect(0,0,w,h);
  mottle(g,w,h,60,['#c4c0b9','#aaa69f'],30,120,.08,.18); speckle(g,w,h,8000,['#9d9993','#cfcbc4'],1,2,.4);
  g.strokeStyle='rgba(90,86,80,.55)'; g.lineWidth=3; for(const p of [1,w/2]){ g.beginPath(); g.moveTo(p,0); g.lineTo(p,h); g.stroke(); g.beginPath(); g.moveTo(0,p); g.lineTo(w,p); g.stroke(); } });
T.deck = makeTex(512,512,(g,w,h)=>{ g.fillStyle='#3a3734'; g.fillRect(0,0,w,h);
  speckle(g,w,h,6000,['#46423e','#2e2b29'],1,3,.5);
  for(let i=0;i<8;i++){ g.fillStyle='rgba(0,0,0,.45)'; g.fillRect(0,i*h/8,w,3); g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(0,i*h/8+3,w,2);} });
T.mallFloor = makeTex(512,512,(g,w,h)=>{ g.fillStyle='#d9d5cd'; g.fillRect(0,0,w,h);
  speckle(g,w,h,6000,['#cdc8bf','#e5e1da'],1,2,.4);
  g.strokeStyle='rgba(150,144,136,.5)'; g.lineWidth=2; for(const p of [1,w/2]){ g.beginPath(); g.moveTo(p,0); g.lineTo(p,h); g.stroke(); g.beginPath(); g.moveTo(0,p); g.lineTo(w,p); g.stroke(); } });
T.asphalt = makeTex(512,512,(g,w,h)=>{ g.fillStyle='#4a4b4e'; g.fillRect(0,0,w,h); speckle(g,w,h,16000,['#5a5b5e','#3d3e41','#66666a'],1,2,.6); });
T.facade = makeTex(512,512,(g,w,h)=>{ g.fillStyle='#d3d3d0'; g.fillRect(0,0,w,h); mottle(g,w,h,40,['#dcdcd9','#c8c8c5'],40,160,.2,.35);
  g.strokeStyle='rgba(120,120,118,.55)'; g.lineWidth=3; g.strokeRect(1,1,w-2,h-2); });

function drawTree(g,cx,base,h,color){
  g.fillStyle=color;
  g.beginPath(); g.moveTo(cx-h*.07,base); g.quadraticCurveTo(cx-h*.02,base-h*.25,cx-h*.035,base-h*.5);
  g.lineTo(cx+h*.035,base-h*.5); g.quadraticCurveTo(cx+h*.02,base-h*.25,cx+h*.07,base); g.closePath(); g.fill();
  const r=mulberry32(11);
  for(let i=0;i<46;i++){ const a=r()*Math.PI*2, d=Math.sqrt(r())*h*.3;
    g.beginPath(); g.arc(cx+Math.cos(a)*d*1.25, base-h*.7+Math.sin(a)*d*.85, h*(.045+r()*.05),0,Math.PI*2); g.fill(); }
}
function drawWordmark(g,cx,cy,size,color){
  g.font=`600 ${size}px Jost, sans-serif`; g.textBaseline='alphabetic'; g.fillStyle=color;
  const a='coffee', b='berry', gap=size*.95; const wa=g.measureText(a).width, wb=g.measureText(b).width;
  const total=wa+gap+wb, x0=cx-total/2;
  g.textAlign='left'; g.fillText(a,x0,cy); g.fillText(b,x0+wa+gap,cy);
  drawTree(g,x0+wa+gap/2,cy+size*.05,size*1.55,color);
}
T.logoDark = makeTex(1024,320,(g,w,h)=>{ g.clearRect(0,0,w,h); drawWordmark(g,w/2,h*.78,128,'#2a1d15'); },true);

/* ---------- geometry helpers ---------- */
const blocks=[], floors=[], mapRects=[];
function block(x0,z0,x1,z1){ blocks.push([Math.min(x0,x1),Math.min(z0,z1),Math.max(x0,x1),Math.max(z0,z1)]); }
function boxGeo(w,h,d,tile){
  const g=new THREE.BoxGeometry(w,h,d);
  if(tile){ const uv=g.attributes.uv; const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
    for(let f=0;f<6;f++) for(let i=0;i<4;i++){ const k=f*4+i; uv.setXY(k,uv.getX(k)*dims[f][0]/tile,uv.getY(k)*dims[f][1]/tile); }
    uv.needsUpdate=true; }
  return g;
}
function bx(x0,z0,x1,z1,y0,y1,mat,o){
  o=o||{}; const w=Math.abs(x1-x0),d=Math.abs(z1-z0),h=y1-y0;
  const m=new THREE.Mesh(boxGeo(w,h,d,mat.userData?mat.userData.tile:0),mat);
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  m.castShadow=o.cast!==false && mat!==M.glass && mat!==M.displayGlass; m.receiveShadow=o.receive!==false;
  (o.parent||scene).add(m);
  if(o.block) block(x0,z0,x1,z1);
  if(o.map) mapRects.push({x0:Math.min(x0,x1),z0:Math.min(z0,z1),x1:Math.max(x0,x1),z1:Math.max(z0,z1),k:o.map});
  if(o.floor) floors.push(m);
  return m;
}
function rbx(cx,cz,len,dep,y0,y1,ry,mat,o){
  o=o||{}; const m=new THREE.Mesh(boxGeo(len,y1-y0,dep,mat.userData?mat.userData.tile:0),mat);
  m.position.set(cx,(y0+y1)/2,cz); m.rotation.y=ry; m.castShadow=o.cast!==false; m.receiveShadow=true; scene.add(m); return m;
}
function plane(w,h,mat,x,y,z,ry){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat); m.position.set(x,y,z); m.rotation.y=ry||0; m.receiveShadow=true; scene.add(m); return m; }
function floorGlow(x0,z0,x1,z1,y,alongX,base){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),glowMat(T.glowDown,base));
  m.rotation.x=-Math.PI/2; m.position.set((x0+x1)/2,y,(z0+z1)/2);

}

function slab(pts,y,th,mat,tile){
  const s=new THREE.Shape(); pts.forEach((p,i)=> i? s.lineTo(p[0],-p[1]) : s.moveTo(p[0],-p[1]));
  const g=new THREE.ExtrudeGeometry(s,{depth:th,bevelEnabled:false});
  const uv=g.attributes.uv; for(let i=0;i<uv.count;i++) uv.setXY(i,uv.getX(i)/tile,uv.getY(i)/tile);
  const m=new THREE.Mesh(g,mat); m.rotation.x=-Math.PI/2; m.position.y=y; m.receiveShadow=true; scene.add(m); return m;
}
function cyl(rt,rb,h,mat,x,y0,z,seg,parent){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16),mat); m.position.set(x,y0+h/2,z); m.castShadow=true; m.receiveShadow=true; (parent||scene).add(m); return m; }
function blob(r,mat,x,y,z,sx,sy,sz){
  const g=new THREE.IcosahedronGeometry(r,2); const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const f=1+(R()-.5)*.28; p.setXYZ(i,p.getX(i)*f,p.getY(i)*f,p.getZ(i)*f); }
  g.computeVertexNormals(); const m=new THREE.Mesh(g,mat); m.position.set(x,y,z); m.scale.set(sx||1,sy||1,sz||1); m.castShadow=true; m.receiveShadow=true; scene.add(m); return m;
}

function inZone(x,z){
  if(x>.2&&x<4.8&&z>.2&&z<10.6&&(x-z)<2) return true;
  if(x>.2&&x<10.8&&z>10.4&&z<16.25) return true;
  if(x>10.2&&x<11.0&&z>16.0&&z<16.9) return true;
  if(z<-.2&&z>-7.6&&x>-5.7&&x<7.5) return true;
  if(z>=-.2&&z<3.0&&x<7.5&&(x-z)>2) return true;
  if(z>16.55&&z<27.8&&x>-1.5&&x<14.5) return true;
  return false;
}
const RAD=.2;
function free(x,z){
  if(!inZone(x,z)) return false;
  for(const b of blocks){ if(x>b[0]-RAD&&x<b[2]+RAD&&z>b[1]-RAD&&z<b[3]+RAD) return false; }
  return true;
}

const EYE=1.6;
const cam={x:0,z:0,yaw:0,pitch:0,bob:0};
let currentNode=-1, flight=null, walkTarget=null, tour={on:false,wait:0,idx:-1};
const keys={}; const joy={x:0,y:0,active:false};
function lookAngles(fx,fy,fz,tx,ty,tz){ const dx=tx-fx,dz=tz-fz,dy=ty-fy; return {yaw:Math.atan2(-dx,-dz),pitch:Math.atan2(dy,Math.hypot(dx,dz))}; }
function angDiff(a,b){ let d=b-a; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI; return d; }
function setNodeImmediate(i){ const n=NODES[i]; cam.x=n.pos[0]; cam.z=n.pos[1]; const a=lookAngles(cam.x,EYE,cam.z,...n.look); cam.yaw=a.yaw; cam.pitch=a.pitch; currentNode=i; }
function pathTo(i){
  const target=routeIndex(i); let start;
  if(currentNode>=0 && Math.hypot(cam.x-NODES[currentNode].pos[0],cam.z-NODES[currentNode].pos[1])<.3) start=routeIndex(currentNode);
  else { let best=1e9; ROUTE.forEach((q,k)=>{ const d=Math.hypot(q.p[0]-cam.x,q.p[1]-cam.z); if(d<best){best=d;start=k;} }); }
  const pts=[[cam.x,cam.z]];
  if(start<=target){ for(let k=start;k<=target;k++) pts.push(ROUTE[k].p); } else { for(let k=start;k>=target;k--) pts.push(ROUTE[k].p); }
  const out=[pts[0]]; for(let k=1;k<pts.length;k++){ const a=out[out.length-1],b=pts[k]; if(Math.hypot(a[0]-b[0],a[1]-b[1])>.05) out.push(b); }
  return out;
}
function startFlight(pts,look,onDone,speed){
  const lens=[0]; for(let k=1;k<pts.length;k++) lens.push(lens[k-1]+Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]));
  const total=lens[lens.length-1];
  const end=pts[pts.length-1]; const fa=lookAngles(end[0],EYE,end[1],...look);
  const dur=Math.max(1.2,total/(speed||1.7));
  flight={pts,lens,total,t:0,dur,yaw0:cam.yaw,pitch0:cam.pitch,yaw1:fa.yaw,pitch1:fa.pitch,onDone,lastTravel:cam.yaw};
  walkTarget=null;
}
function goNode(i,fromTour){
  if(!fromTour) stopTour();

  startFlight(pts,NODES[i].look,()=>{ currentNode=i; setActive(i); showStory(i); if(tour.on){ tour.wait=reduceMotion?4.5:5.5; } });
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const smooth=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
function stepFlight(dt){
  const f=flight; f.t+=dt; const u=Math.min(1,f.t/f.dur); const s=ease(u)*f.total;
  let k=1; while(k<f.lens.length-1 && f.lens[k]<s) k++;
  const a=f.pts[k-1], b=f.pts[k]||a, seg=(f.lens[k]-f.lens[k-1])||1, w=Math.min(1,Math.max(0,(s-f.lens[k-1])/seg));
  const nx=a[0]+(b[0]-a[0])*w, nz=a[1]+(b[1]-a[1])*w;
  if(f.total>.6){ const ty=Math.atan2(-(b[0]-a[0]),-(b[1]-a[1])); f.lastTravel=f.lastTravel+angDiff(f.lastTravel,ty)*Math.min(1,dt*4); }
  const startBlend=smooth(0,.12,u), endBlend=smooth(.72,1,u);
  const travelYaw=f.total>.6?f.lastTravel:f.yaw1;
  let y=f.yaw0+angDiff(f.yaw0,travelYaw)*startBlend; y=y+angDiff(y,f.yaw1)*endBlend; cam.yaw=y;
  const midPitch=f.pitch0+(-.04-f.pitch0)*startBlend; cam.pitch=midPitch+(f.pitch1-midPitch)*endBlend;
  if(!reduceMotion){ const moved=Math.hypot(nx-cam.x,nz-cam.z); cam.bob+=moved; }
  cam.x=nx; cam.z=nz;
  if(u>=1){ const done=f.onDone; flight=null; if(done) done(); }
}
function tryMove(dx,dz){
  let moved=false;
  if(free(cam.x+dx,cam.z)){ cam.x+=dx; moved=true; }
  if(free(cam.x,cam.z+dz)){ cam.z+=dz; moved=true; }
  if(moved && !reduceMotion) cam.bob+=Math.hypot(dx,dz);
  return moved;
}
function userMoved(){ if(tour.on) stopTour(); if(flight){ flight=null; } currentNode=-1; setActive(-1); }

/* ---------- loop ---------- */
const clock=new THREE.Clock();
let whereLast='';
function frame(){
  const dt=Math.min(.05,clock.getDelta());
  const fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+(-joy.y);
  const str=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x;
  const turn=(keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0)+(keys.KeyQ?1:0)-(keys.KeyE?1:0);
  if(Math.abs(fwd)>.05||Math.abs(str)>.05||Math.abs(turn)>.05){
    if(flight||tour.on||walkTarget) userMoved();
    walkTarget=null;
    cam.yaw+=turn*dt*1.6;
    const sp=(keys.ShiftLeft||keys.ShiftRight?3.2:1.6)*dt;
    const sx=-Math.sin(cam.yaw), sz=-Math.cos(cam.yaw), rx=Math.cos(cam.yaw), rz=-Math.sin(cam.yaw);
    let mx=sx*fwd+rx*str, mz=sz*fwd+rz*str; const l=Math.hypot(mx,mz); if(l>1){mx/=l;mz/=l;}
    if(l>.02){ tryMove(mx*sp,mz*sp); currentNode=-1; }
  }
  if(flight) stepFlight(dt);
  else if(walkTarget){
    const dx=walkTarget[0]-cam.x, dz=walkTarget[1]-cam.z, d=Math.hypot(dx,dz);
    if(d<.08){ walkTarget=null; }
    else { const sp=Math.min(d,1.7*dt); const ok=tryMove(dx/d*sp,dz/d*sp);
      const ty=Math.atan2(-dx,-dz); if(d>.4) cam.yaw+=angDiff(cam.yaw,ty)*Math.min(1,dt*2.5);
      if(!ok){ walkTarget=null; toast('That spot is blocked'); } }
  }
  if(tour.on && !flight && tour.wait>0){ tour.wait-=dt; if(tour.wait<=0){ const nx=currentNode+1; if(nx<NODES.length) goNode(nx,true); else { stopTour(); toast('Tour complete'); } } }
  camera.position.set(cam.x,EYE+(reduceMotion?0:Math.sin(cam.bob*Math.PI*2/1.3)*.018),cam.z);
  camera.rotation.set(cam.pitch,cam.yaw,0);
  if(!reduceMotion){ const s=.2+Math.sin(performance.now()/450)*.02; hotspots.forEach(h=>h.scale.set(s,s,s)); }
  const w=whereName(cam.x,cam.z); if(w!==whereLast){ whereLast=w; whereEl.innerHTML=w; }
  renderer.render(scene,camera);
  drawMap();
  requestAnimationFrame(frame);
}
function whereName(x,z){
  if(z<0 || (z<3 && x-z>2)) return 'You’re in the <b>Leo-Center concourse</b>';
  if(z>=16.45){ if(x>TX0&&x<TX1&&z>TZ0&&z<TZ1) return 'You’re on the <b>terrace</b>'; return 'You’re on the <b>street</b>'; }
  if(z<10.1 && x<1.75) return 'You’re <b>behind the bar</b>';
  if(z<10.4) return 'You’re at the <b>bar and order corridor</b>';
  if(x<2.6 && z<14) return 'You’re at the <b>banquette</b>';
  return 'You’re in the <b>dining room</b>';
}

  terraceLights.forEach(l=>l.intensity=ev?.75:0); RIB.emissiveIntensity=ev?2.2:0;
  LED.emissiveIntensity=ev?2.4:1.0; LENS.emissiveIntensity=ev?2.0:1.2; OPAL.emissiveIntensity=ev?1.6:.6;
  GLOW.forEach(m=>m.opacity=m.userData.base*(ev?1.7:.6));
  treeGlow.material.opacity=ev?.5:0;
  M.sign.emissiveIntensity=ev?.45:0;
  renderer.toneMappingExposure=ev?.95:1.0;
  MATS.forEach(m=>{ if(m.userData.baseEnv==null) m.userData.baseEnv=m.envMapIntensity; m.envMapIntensity=m.userData.baseEnv*(ev?.22:1); });
}
modeBtn.addEventListener('click',()=>setMode(!evening));

/* pointer: drag to look, click to walk or open details */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let drag=null;
canvas.addEventListener('pointerdown',e=>{ if(e.button!==0&&e.pointerType==='mouse') return; canvas.focus({preventScroll:true}); drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),moved:false}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>5){ if(!drag.moved){ drag.moved=true; canvas.classList.add('dragging'); if(tour.on) stopTour(); if(flight){ flight=null; currentNode=-1; setActive(-1);} } }
  if(drag.moved){ const k=e.pointerType==='touch'?.006:.0042; cam.yaw+=dx*k; cam.pitch=Math.max(-1.2,Math.min(1.2,cam.pitch+dy*k*.85)); } });
function endDrag(e){ if(!drag||e.pointerId!==drag.id) return; const wasClick=!drag.moved&&performance.now()-drag.t<450; canvas.classList.remove('dragging'); drag=null; if(wasClick) clickAt(e.clientX,e.clientY); }
canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',e=>{ drag=null; canvas.classList.remove('dragging'); });
function clickAt(cx,cy){
  const r=canvas.getBoundingClientRect(); ndc.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hh=ray.intersectObjects(hotspots,false); if(hh.length){ showCard(hh[0].object.userData); return; }
  const all=ray.intersectObjects(scene.children,true).filter(i=>!(i.object.isSprite)&&i.object.material!==M.glass&&!(i.object.material&&i.object.material.blending===THREE.AdditiveBlending));
  if(!all.length) return; const hit=all[0];
  if(floors.indexOf(hit.object)<0 && hit.face && hit.face.normal && hit.object.matrixWorld){ const n=hit.face.normal.clone().transformDirection(hit.object.matrixWorld); if(n.y<.7){ toast('Click the floor to walk there'); return; } }
  if(hit.point.y>.1){ toast('Click the floor to walk there'); return; }
  if(!free(hit.point.x,hit.point.z)){ toast('That spot is blocked'); return; }
  if(Math.hypot(hit.point.x-cam.x,hit.point.z-cam.z)>14){ toast('Too far, walk closer first'); return; }
  if(tour.on) stopTour(); flight=null; currentNode=-1; setActive(-1);
  walkTarget=[hit.point.x,hit.point.z];
}
canvas.addEventListener('wheel',e=>{ e.preventDefault(); camera.fov=Math.max(40,Math.min(80,camera.fov+e.deltaY*.03)); camera.updateProjectionMatrix(); },{passive:false});
window.addEventListener('keydown',e=>{ if(e.target.tagName==='BUTTON'&&(e.code==='Space'||e.code==='Enter')) return; keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='Escape'){ help.hidden=true; hideCard(); } });
window.addEventListener('keyup',e=>{ keys[e.code]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });

/* joystick */
const joyEl=document.getElementById('joy'), knob=document.getElementById('knob'); let joyId=null;
function joyMove(e){ const r=joyEl.getBoundingClientRect(); let x=(e.clientX-(r.left+r.width/2))/(r.width/2), y=(e.clientY-(r.top+r.height/2))/(r.height/2); const l=Math.hypot(x,y); if(l>1){x/=l;y/=l;}
  joy.x=Math.abs(x)<.12?0:x; joy.y=Math.abs(y)<.12?0:y; knob.style.transform=`translate(${x*35}px,${y*35}px)`; }
joyEl.addEventListener('pointerdown',e=>{ joyId=e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); });
joyEl.addEventListener('pointermove',e=>{ if(e.pointerId===joyId) joyMove(e); });
const joyEnd=e=>{ if(e.pointerId!==joyId) return; joyId=null; joy.x=joy.y=0; knob.style.transform=''; };
joyEl.addEventListener('pointerup',joyEnd); joyEl.addEventListener('pointercancel',joyEnd);

/* ---------- map ---------- */
const mapC=document.getElementById('map'), mg=mapC.getContext('2d');
const MX0=-6.5, MZ0=-8.5, MW=22, MH=37;
let mapScale=6;
function sizeMap(){ const r=mapC.getBoundingClientRect(); const dpr=window.devicePixelRatio||1; mapC.width=Math.round(r.width*dpr); mapC.height=Math.round(r.height*dpr); mapScale=Math.min(r.width/MW,r.height/MH)*dpr; }
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let palette={};
function readPalette(){ palette={floor:css('--map-floor'),mall:css('--map-mall'),street:css('--map-street'),terrace:css('--map-terrace'),solid:css('--map-solid'),furn:css('--map-furn'),me:css('--map-me'),ink:css('--ink'),accent:css('--accent')}; }
const mx=x=>(x-MX0)*mapScale, mz=z=>(z-MZ0)*mapScale;
function drawMap(){
  if(mapwrap.hidden) return;
  const w=mapC.width,h=mapC.height; mg.clearRect(0,0,w,h);
  mg.fillStyle=palette.mall; mg.fillRect(mx(-6),mz(-8),14*mapScale,8*mapScale);
  mg.beginPath(); mg.moveTo(mx(2),mz(0)); mg.lineTo(mx(7.8),mz(0)); mg.lineTo(mx(7.8),mz(3)); mg.lineTo(mx(5),mz(3)); mg.closePath(); mg.fill();
  mg.fillStyle=palette.street; mg.fillRect(mx(-1.5),mz(16.4),16*mapScale,11.6*mapScale);
  mg.fillStyle=palette.terrace; mg.fillRect(mx(TX0),mz(TZ0),(TX1-TX0)*mapScale,(TZ1-TZ0)*mapScale);
  mg.fillStyle=palette.floor; mg.beginPath(); OUTLINE.forEach((p,i)=> i?mg.lineTo(mx(p[0]),mz(p[1])):mg.moveTo(mx(p[0]),mz(p[1]))); mg.closePath(); mg.fill();
  for(const r of mapRects){ mg.fillStyle= r.k==='s'?palette.solid : r.k==='g'?palette.solid : palette.furn; if(r.k==='p') mg.fillStyle=palette.solid;
    mg.fillRect(mx(r.x0),mz(r.z0),Math.max(1,(r.x1-r.x0)*mapScale),Math.max(1,(r.z1-r.z0)*mapScale)); }
  NODES.forEach((n,i)=>{ const x=mx(n.pos[0]),y=mz(n.pos[1]); mg.beginPath(); mg.arc(x,y,5.5*(mapScale/6),0,Math.PI*2); mg.fillStyle=i===currentNode?palette.accent:palette.ink; mg.fill();
    mg.fillStyle=getComputedStyle(document.body).backgroundColor==='rgb(0, 0, 0)'?'#fff':(i===currentNode?'#fff':palette.floor); mg.font=`600 ${Math.round(7.5*mapScale/6)}px Jost, sans-serif`; mg.textAlign='center'; mg.textBaseline='middle'; mg.fillText(String(i+1),x,y+.5); });
  const px=mx(cam.x),pz=mz(cam.z), fov=camera.fov*Math.PI/180*camera.aspect*.5, len=26*(mapScale/6);
  const dir=Math.atan2(-Math.cos(cam.yaw),-Math.sin(cam.yaw));
  mg.beginPath(); mg.moveTo(px,pz); mg.arc(px,pz,len,dir-fov,dir+fov); mg.closePath(); mg.fillStyle=palette.me; mg.globalAlpha=.3; mg.fill(); mg.globalAlpha=1;
  mg.beginPath(); mg.arc(px,pz,4.5*(mapScale/6),0,Math.PI*2); mg.fillStyle=palette.me; mg.fill(); mg.lineWidth=2*(mapScale/6); mg.strokeStyle='#fff'; mg.stroke();
}
mapC.addEventListener('click',e=>{ const r=mapC.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
  const x=(e.clientX-r.left)*dpr/mapScale+MX0, z=(e.clientY-r.top)*dpr/mapScale+MZ0;
  for(let i=0;i<NODES.length;i++){ if(Math.hypot(NODES[i].pos[0]-x,NODES[i].pos[1]-z)<1.2){ goNode(i); return; } }
  if(!free(x,z)){ toast('Pick an open floor spot'); return; }
  stopTour(); hideCard(); currentNode=-1; setActive(-1);
  const a=lookAngles(x,EYE,z,x-Math.sin(cam.yaw),EYE,z-Math.cos(cam.yaw));
  startFlight([[cam.x,cam.z],[x,z]],[x-Math.sin(cam.yaw)*3,EYE+Math.sin(cam.pitch)*3,z-Math.cos(cam.yaw)*3],null,3.5);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readPalette);

/* ---------- resize + start ---------- */
function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w<h?78:68; camera.updateProjectionMatrix(); sizeMap(); }
window.addEventListener('resize',resize);
resize(); readPalette(); setMode(false);
setNodeImmediate(0); setActive(0); showStory(0);
document.getElementById('loading').classList.add('done');
canvas.focus({preventScroll:true});
window.cbTour={jump:i=>{flight=null;setNodeImmediate(i);setActive(i);showStory(i);},evening:setMode};
requestAnimationFrame(frame);
})().catch(err=>{ const l=document.getElementById('loading'); if(l){ l.classList.remove('done'); l.querySelector('.s').textContent='The 3D view could not start: '+err.message+'. Try a browser with WebGL enabled.'; } console.error(err); });
</script>
</body>
